# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Proxies (Varnish, a load balancer, a TLS terminator) whose X-Forwarded-* headers are trusted,
    # read from the TRUSTED_PROXIES environment variable that .env and the vhost examples set
    # (comma separated IPs or CIDR ranges). Unset or empty trusts none. X-Forwarded-Host stays
    # untrusted, as in the Platform front controllers this setting replaces.
    trusted_proxies: '%env(default::TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    # The phpstorm option is supported natively by PhpStorm on MacOS, Linux requires
    # phpstorm-url-handler https://github.com/sanduhrs/phpstorm-url-handler.
    ide: 'phpstorm://open?file=%%f&line=%%l'
    # For Visual Studio Code replace with following
    #ide: 'vscode://file/%%f:%%l'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
