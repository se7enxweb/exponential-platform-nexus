services:
    # The schema completion of exponential:install, on an existing database
    App\RepositoryInstaller\Command\LegacySchemaCompleteCommand:
        arguments:
            $connection: '@ibexa.persistence.connection'
            $projectDir: '%kernel.project_dir%'
        tags:
            - { name: console.command }

    App\RepositoryInstaller\Command\ExponentialReindexCommand:
        tags:
            - { name: console.command }

    App\RepositoryInstaller\Installer\ExponentialMediaInstaller:
        autowire: true
        parent: Ibexa\Bundle\RepositoryInstaller\Installer\DbBasedInstaller
        calls:
            - [setProjectDir, ['%kernel.project_dir%']]
            - [setStoragePath, ['public/var/site/storage']]
        tags:
            - { name: ibexa.installer, type: exponential-media }

    App\RepositoryInstaller\Command\ExponentialInstallCommand:
        arguments:
            $connection: '@ibexa.persistence.connection'
            $installers: []
            $cachePool: '@ibexa.cache_pool'
            $environment: "%kernel.environment%"
            $repositoryConfigurationProvider: '@Ibexa\Bundle\Core\ApiLoader\RepositoryConfigurationProvider'
        tags:
            - { name: console.command }
