parameters:

services:
    cjw_exponential_installer.media_site:
        class: Netgen\Bundle\SiteInstallerBundle\Installer\NetgenSiteInstaller
        public: false
        calls:
            - [setInstallerDataPath, ["%kernel.project_dir%/vendor/se7enxweb/cjw-exponential-media-site-data/cjw-exponential-media"]]
            - [setStoragePath, [ezpublish_legacy/var/site/storage]]
        parent: ezplatform.installer.db_based_installer
        tags:
            - {name: ezplatform.installer, type: cjw-exponential-media}


    ngsite.layouts.block.plugin.vertical_whitespace_v2:
        class: Netgen\Bundle\SiteBundle\Layouts\Block\Plugin\VerticalWhitespaceV2Plugin
        arguments:
            - "%ngsite.layouts.block.plugin.vertical_whitespace.top%"
            - "%ngsite.layouts.block.plugin.vertical_whitespace.bottom%"
        tags:
            - { name: netgen_layouts.block_definition_handler.plugin, priority: 200 }

    app.twig.extension:
        class: AppBundle\Twig\AppExtension
        arguments: ['@service_container', '@cjw_publishtools.service.functions', '@ezpublish.templating.global_helper.core']
        tags:
            - { name: twig.extension }
